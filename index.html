<!doctype html>
<html lang="en" data-font="geist" data-theme="ultraviolet">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/chessee-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07050e" />
    <meta
      name="description"
      content="Chessee: play powerful chess bots and see every move explained, like a real grandmaster."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Manrope 800 is the default display face. Every other font system is
         lazy-loaded by the Style Lab (see src/theme/styleStore.ts). Geist Sans
         and Geist Pixel Square are self-hosted from the `geist` package. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap"
      rel="stylesheet"
    />
    <script>
      /* TEMP-DEBUG */
      window.__errs = [];
      var _w = console.warn, _e = console.error;
      console.warn = function () { window.__errs.push([].map.call(arguments, function (x) { return (x && x.stack) || String(x); }).join(" | ")); _w.apply(console, arguments); };
      console.error = function () { window.__errs.push([].map.call(arguments, function (x) { return (x && x.stack) || String(x); }).join(" | ")); _e.apply(console, arguments); };
      window.addEventListener("error", function (e) { window.__errs.push("E:" + e.message + " " + (e.error && e.error.stack)); });
    </script>
    <title>Chessee: See the board like a real grandmaster</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
